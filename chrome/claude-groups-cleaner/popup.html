<!doctype html>
<html lang="ru">
<head>

  <style>
    body { font: 13px system-ui, sans-serif; margin: 12px; width: 280px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }

    p { margin: 8px 0 0; color: #666; }
  </style>

  <ul id="list"></ul>
  <button id="close">Закрыть все, кроме текущей</button>

</html>
